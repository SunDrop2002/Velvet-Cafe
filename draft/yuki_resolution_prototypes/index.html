<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuki — resolution prototypes</title>
<style>body{background:#171b23;color:#eee;font:16px system-ui;margin:32px}h1{font-size:25px}p{color:#bcc5d6}main{display:flex;gap:24px;flex-wrap:wrap}article{background:#222832;padding:20px;border-radius:12px;text-align:center}canvas{image-rendering:pixelated;display:block;margin:auto;background:repeating-conic-gradient(#282f39 0% 25%,#252b35 0% 50%) 0/16px 16px}.large{width:288px;height:288px}.native{height:100px;display:grid;place-items:center}button,a{color:#c6d9ff}button{background:#333d50;border:1px solid #66748c;padding:8px 14px;cursor:pointer}small{display:block;color:#bcc5d6}a{display:inline-block;margin-top:14px}</style>
<h1>Yuki — 64×64 and 32×32 prototypes</h1><p>Original idle-down pixels, reduced with nearest-neighbor sampling. Same palette, proportions and source animation timing.</p>
<p>Top: equal display size for detail comparison. Bottom: actual pixel sizes. Transparent PNGs; no smoothing or redrawing.</p>
<button id="play">Pause</button> <span id="status"></span><br><br><main></main>
<script>
const durations=[240,240,240,240,240,240,240,240,240,240,240,240,240,240,240,240,240,60,160,200,160,240,240];let frame=0,elapsed=0,loops=0,playing=true,last=performance.now();const views=[];
for(const size of [96,64,32]){const card=document.createElement('article');card.innerHTML=`<h2>${size}×${size}${size===96?' · original':''}</h2><canvas class="large" width="${size}" height="${size}"></canvas><p>Native size</p><div class="native"><canvas width="${size}" height="${size}"></canvas></div><a href="yuki_idle_down_${size}x${size}.png">Rest pose PNG</a> · <a href="yuki_idle_down_${size}x${size}_sheet.png">Sprite sheet</a>`;document.querySelector('main').append(card);const img=new Image();img.src=`yuki_idle_down_${size}x${size}_sheet.png`;views.push({img,size,canvases:card.querySelectorAll('canvas')});}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Pause':'Play'};
function tick(now){if(playing){elapsed+=Math.min(now-last,100);while(elapsed>=durations[frame]){elapsed-=durations[frame];frame=(frame+1)%23;if(frame===0)loops++;}}last=now;for(const v of views)if(v.img.complete&&v.img.naturalWidth)for(const c of v.canvases){const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,v.size,v.size);ctx.drawImage(v.img,frame*v.size,0,v.size,v.size,0,0,v.size,v.size);}document.querySelector('#status').textContent=`Frame ${frame+1}/23 · loops ${loops}`;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
