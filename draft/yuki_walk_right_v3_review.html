<!doctype html><html><meta charset="utf-8"><title>Yuki — right walk review</title><style>body{background:#27272b;color:#eee;font:16px system-ui;padding:24px}main{display:flex;gap:32px;flex-wrap:wrap}.sprite{width:384px;height:384px;image-rendering:pixelated;background-repeat:no-repeat;background-size:auto 384px;background-color:#37373e}.idle{background-image:url(yuki_idle_down_blink_v3_rest.png)}.walk{background-image:url(yuki_walk_right_96x96_sheet_v3.png)}button{padding:8px 16px}p{max-width:800px}</style><h1>Yuki: original and right-walk candidate</h1><p>96×96 cells shown at 4×. Six walking frames, 8 FPS. Exact source palette, transparent PNG. Visual identity remains subject to review.</p><main><section><h2>Canonical idle</h2><div class="sprite idle"></div></section><section><h2>Right walk</h2><div class="sprite walk" id="walk"></div></section></main><p><button id="pause">Pause</button> <span id="frame"></span></p><script>let i=0,playing=true;function draw(){document.getElementById('walk').style.backgroundPosition=(-i*384)+'px 0';document.getElementById('frame').textContent='Frame '+(i+1)+' / 6'}setInterval(()=>{if(playing){i=(i+1)%6;draw()}},125);document.getElementById('pause').onclick=()=>{playing=!playing;document.getElementById('pause').textContent=playing?'Pause':'Play'};draw();</script></html>
